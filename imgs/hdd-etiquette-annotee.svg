<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="42" font-size="17" font-weight="bold" fill="#0f172a">Lire l'étiquette d'un disque (exemple : WD Red Plus 8 To)</text>

  <!-- Dessus du disque -->
  <rect x="50" y="80" width="330" height="240" rx="10" fill="#d7dee7" stroke="#64748b" stroke-width="2"/>
  <circle cx="90" cy="105" r="4" fill="#94a3b8"/>
  <circle cx="340" cy="105" r="4" fill="#94a3b8"/>
  <circle cx="90" cy="295" r="4" fill="#94a3b8"/>
  <circle cx="340" cy="295" r="4" fill="#94a3b8"/>

  <!-- Étiquette -->
  <rect x="70" y="118" width="290" height="170" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="85" y="148" font-size="20" font-weight="bold" fill="#b91c1c">WD Red™ Plus</text>
  <text x="85" y="164" font-size="10" fill="#475569" letter-spacing="1">NAS HARD DRIVE · CMR</text>
  <text x="85" y="198" font-size="26" font-weight="bold" fill="#0f172a">8 TB</text>
  <text x="85" y="222" font-size="13" font-family="Consolas, monospace" fill="#0f172a">Model: WD80EFPX</text>
  <text x="85" y="240" font-size="11" font-family="Consolas, monospace" fill="#334155">S/N: WX52D91K7643</text>
  <text x="85" y="258" font-size="11" font-family="Consolas, monospace" fill="#334155">Date: 12 MAR 2026</text>
  <text x="85" y="276" font-size="11" fill="#475569">5640 RPM · SATA 6 Gb/s · 256 MB cache</text>
  <!-- Code-barres -->
  <g fill="#0f172a">
    <rect x="250" y="185" width="3" height="34"/>
    <rect x="256" y="185" width="1.5" height="34"/>
    <rect x="261" y="185" width="4" height="34"/>
    <rect x="268" y="185" width="1.5" height="34"/>
    <rect x="273" y="185" width="2.5" height="34"/>
    <rect x="279" y="185" width="1.5" height="34"/>
    <rect x="284" y="185" width="4" height="34"/>
    <rect x="291" y="185" width="2" height="34"/>
    <rect x="296" y="185" width="1.5" height="34"/>
    <rect x="301" y="185" width="3.5" height="34"/>
    <rect x="308" y="185" width="1.5" height="34"/>
    <rect x="313" y="185" width="2.5" height="34"/>
    <rect x="319" y="185" width="4" height="34"/>
    <rect x="326" y="185" width="1.5" height="34"/>
    <rect x="331" y="185" width="3" height="34"/>
  </g>

  <!-- Annotations -->
  <g font-size="14" fill="#0f172a">
    <circle cx="222" cy="218" r="3.5" fill="#0ea5e9"/>
    <line x1="222" y1="218" x2="420" y2="112" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="428" y="108" font-weight="bold">Le suffixe du modèle encode la gamme</text>
    <text x="428" y="126" font-size="12" fill="#475569">EFPX / EFZZ = Red Plus (CMR)</text>
    <text x="428" y="142" font-size="12" fill="#b91c1c">EFAX = Red « tout court » (SMR !)</text>

    <circle cx="165" cy="272" r="3.5" fill="#0ea5e9"/>
    <line x1="165" y1="272" x2="420" y2="188" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="428" y="184" font-weight="bold">Vitesse de rotation</text>
    <text x="428" y="202" font-size="12" fill="#475569">5400-5640 tr/min : silencieux et frais</text>
    <text x="428" y="218" font-size="12" fill="#475569">7200 tr/min : plus rapide (gammes Pro)</text>

    <circle cx="180" cy="254" r="3.5" fill="#0ea5e9"/>
    <line x1="180" y1="254" x2="420" y2="262" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="428" y="258" font-weight="bold">Date de fabrication</text>
    <text x="428" y="276" font-size="12" fill="#475569">à contrôler sur un disque « neuf » déstocké :</text>
    <text x="428" y="292" font-size="12" fill="#475569">la garantie court depuis cette date</text>

    <circle cx="185" cy="236" r="3.5" fill="#0ea5e9"/>
    <line x1="185" y1="236" x2="420" y2="332" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="428" y="328" font-weight="bold">Numéro de série</text>
    <text x="428" y="346" font-size="12" fill="#475569">permet de vérifier l'état de la garantie sur le</text>
    <text x="428" y="362" font-size="12" fill="#475569">site du fabricant — réflexe avant un achat d'occasion</text>
  </g>

  <text x="50" y="400" font-size="12" fill="#b45309">⚠ La mention CMR/SMR figure rarement sur l'étiquette : il faut décoder la référence exacte ou consulter la fiche technique.</text>
</svg>
